name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Code Quality
    runs-on: [self-hosted, tc]
    steps:
      # A docker build leaves root owned files in the workspace, and the next
      # checkout on the same machine cannot remove them.
      - name: Take back the workspace
        if: runner.os == 'Linux'
        run: |
          if [ -d "${{ runner.workspace }}" ]; then
            docker run --rm -v "${{ runner.workspace }}":/ws alpine chown -R $(id -u):$(id -g) /ws
          fi

      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Add the NixOS tool folders to PATH
        if: runner.os == 'Linux'
        run: echo "/run/current-system/sw/bin" >> "$GITHUB_PATH"

      - name: Install quality tools
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli@1.48.0,cargo-machete@0.9.2

      - name: Run quality checks
        run: make ci

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        target: [
            { os: macos, runner: mac },
            { os: windows, runner: windows },

            { os: ios, runner: mac1 },
            { os: android, runner: tc },
          ]
    runs-on: [self-hosted, "${{ matrix.target.runner }}"]
    steps:
      # A docker build leaves root owned files in the workspace, and the next
      # checkout on the same machine cannot remove them.
      - name: Take back the workspace
        if: runner.os == 'Linux'
        run: |
          if [ -d "${{ runner.workspace }}" ]; then
            docker run --rm -v "${{ runner.workspace }}":/ws alpine chown -R $(id -u):$(id -g) /ws
          fi

      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Add the NixOS tool folders to PATH
        if: runner.os == 'Linux'
        run: echo "/run/current-system/sw/bin" >> "$GITHUB_PATH"

      - name: Setup rustscript
        uses: VladasZ/rustscript@v0.1

      - name: Build and test
        if: ${{ matrix.target.os != 'windows' }}
        run: rust build/build.rs ${{ matrix.target.os }}

      - name: Build and test Windows
        if: ${{ matrix.target.os == 'windows' }}
        run: rust build/build.rs

  linux:
    name: Build Linux
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { container: "ubuntu" },
            { container: "debian" },
            { container: "fedora" },
            { container: "archlinux" },
            { container: "amazonlinux" },
            { container: "dockerscripts/linuxmint:cinnamon-minimal" },
          ]
    runs-on: [self-hosted, tc]
    steps:
      # A docker build leaves root owned files in the workspace, and the next
      # checkout on the same machine cannot remove them.
      - name: Take back the workspace
        if: runner.os == 'Linux'
        run: |
          if [ -d "${{ runner.workspace }}" ]; then
            docker run --rm -v "${{ runner.workspace }}":/ws alpine chown -R $(id -u):$(id -g) /ws
          fi

      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Add the NixOS tool folders to PATH
        if: runner.os == 'Linux'
        run: echo "/run/current-system/sw/bin" >> "$GITHUB_PATH"

      - name: Setup rustscript
        uses: VladasZ/rustscript@v0.1

      - name: Build
        run: echo ${{ matrix.target.container }} && rust build/in_docker.rs ${{ matrix.target.container }}
