[workspace]
default-members = ["nome"]
members = ["nome", "nome-android"]

resolver = "3"

[workspace.package]
authors = ["Vladas Zakrevskis <146100@gmail.com>"]
edition = "2024"
version = "0.1.0"

[workspace.metadata.cargo-machete]
ignored = []

[workspace.dependencies]
log = "0.4"
plat = "0.9"
serde = { version = "1", features = ["derive"] }

hilen = { git = "https://github.com/hilen/hilen.git", rev = "6f961029e21f80165ed7eabcb62ac38af321793d", features = ["audio"] }

nome = { path = "nome" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
explicit_deref_methods = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
missing_safety_doc = "allow"
format_push_string = "allow"
new_without_default = "allow"
must_use_candidate = "allow"
module_inception = "allow"
needless_pass_by_value = "allow"
unnecessary_box_returns = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
manual_assert = "allow"
